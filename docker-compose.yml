services:
  postgres:
    image: postgres:16-alpine
    container_name: flashcrypto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flashcrypto
      POSTGRES_PASSWORD: flashcrypto_secret
      POSTGRES_DB: flashcrypto
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcrypto -d flashcrypto"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flashcrypto_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
